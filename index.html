<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5b5bf0">
<title>Expense Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#14162b;--muted:#6b7090;--line:#e8eaf3;--soft:#eef0fb;--accent:#5b5bf0;--accent2:#8b5cf6;--good:#10b981;--bad:#ef4444;--shadow:0 8px 28px rgba(30,30,90,.08);--r:20px;--surface:var(--card);--text:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#171a31;--ink:#eef0ff;--muted:#9aa0c4;--line:#262a4a;--soft:#1f2342;--shadow:0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0e1020;--card:#171a31;--ink:#eef0ff;--muted:#9aa0c4;--line:#262a4a;--soft:#1f2342;--shadow:0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(91,91,240,.35);flex:none}
.logo.big{width:72px;height:72px;font-size:36px;border-radius:22px;margin:0 auto 12px}
h1{font-size:19px;margin:0;line-height:1.2;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.hright{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.pill.ok{color:var(--good)}.pill.warn{background:#fef3c7;color:#92400e}
.me{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--soft);flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600}
.tab span{font-size:20px;line-height:1.2}
.tab.on{color:var(--accent);background:var(--soft)}
nav.tabs.couple-nav{grid-template-columns:repeat(6,minmax(0,1fr))}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:50%;font-size:34px;line-height:1;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px rgba(91,91,240,.5);display:grid;place-items:center;padding-bottom:3px}
.fab:active{transform:scale(.94)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px}
.muted{color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthbar b{font-size:18px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hero small{opacity:.85;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px}
.hero .pos,.hero .neg{color:#fff}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff}.bar.over i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stats.two{grid-template-columns:1fr 1fr}
.stats div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.stats small{display:block;opacity:.85;font-size:11px;text-transform:none;letter-spacing:0;font-weight:500}
.stats b{font-size:15px}
.grid2{display:grid;gap:14px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap{position:relative;width:170px;height:170px;flex:none;margin:0 auto}
.donut{width:100%;height:100%}
.donut circle{fill:none;stroke-width:5}.donut .track{stroke:var(--line)}
.donut-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-mid small{color:var(--muted);font-size:11px}.donut-mid b{font-size:18px}
.legend{flex:1;min-width:150px;display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:11px;height:11px;border-radius:4px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.catrow:last-child{border-bottom:0}
.catrow .top{display:flex;align-items:center;gap:10px}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.catrow .nm{flex:1;font-weight:600}.catrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item .mid{flex:1;min-width:0;display:grid}
.row-item .mid b,.row-item .mid small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item small{color:var(--muted);font-size:12px}
.row-item .end{text-align:right;display:grid;white-space:nowrap}
.amt{white-space:nowrap}
.day{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;padding:12px 4px 4px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:none}
.inp:focus{border-color:var(--accent)}
.filters{display:grid;gap:10px;margin-bottom:12px}
@media(min-width:600px){.filters{grid-template-columns:2fr 1fr}}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;border:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.tracker-switch{display:flex;gap:8px;padding:5px;background:var(--soft);border-radius:16px;margin:0 0 14px}
.tracker-switch button{flex:1;min-width:0;padding:11px 10px;border-radius:12px;font-weight:700;color:var(--muted);font-size:13px}
.tracker-switch button.on{background:var(--card);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.contrib{display:grid;gap:10px}.contrib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.contrib-row .bar{grid-column:1/-1;height:8px}
.btn{padding:14px 18px;border-radius:14px;font-weight:700;text-align:center;width:100%}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:var(--soft)}.btn.danger{background:var(--bad);color:#fff}
.btn.outline-danger{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.hero .btn{padding:13px 8px;white-space:nowrap;font-size:15px}
.btn.link{background:none;color:var(--muted);font-weight:600;padding:10px}
.btn.sm{padding:9px 14px;font-size:14px;width:auto}
.row{display:flex;gap:10px;margin-top:14px}
.stack{display:grid;gap:10px}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}.empty .e{font-size:40px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,30,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@media(min-width:860px){.overlay{align-items:center}.sheet{border-radius:26px;padding-bottom:22px}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 14px;font-size:19px}
.sheet label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.amountbox{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0}
.amountbox span{font-size:30px;font-weight:700;color:var(--muted)}
.amount{width:60%;max-width:260px;border:0;background:none;font-size:46px;font-weight:800;text-align:left;outline:none;min-width:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw.on{border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.avatar.lg{width:72px;height:72px;font-size:36px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.mrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow input{width:96px;text-align:right;padding:10px 12px}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);font-weight:800;color:#fff}
.chk.on{background:var(--accent);border-color:var(--accent)}
.tag{font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);padding:2px 8px;border-radius:99px;margin-left:6px}
#gate{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:20px}
body[data-mode=gate] #gate{display:flex}
body[data-mode=gate] .app,body[data-mode=gate] #fab{display:none}
.gate-card{width:100%;max-width:440px;background:var(--card);border-radius:28px;padding:30px 22px;box-shadow:var(--shadow);text-align:center}
.gate-card h2{margin:0 0 6px;font-size:23px}
.gate-card p{color:var(--muted);margin:6px 0 18px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin:18px 0}
.user{display:grid;gap:8px;justify-items:center;padding:16px 8px;border-radius:20px;background:var(--soft);font-weight:700;min-width:0}
.user span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{text-align:center;font-size:30px;letter-spacing:.5em;padding-left:.5em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
@media(min-width:860px){
 nav.tabs{position:static;display:inline-grid;grid-template-columns:repeat(6,auto);border:0;border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:16px;gap:4px}
 .tab{flex-direction:row;gap:8px;padding:9px 18px;border-radius:999px;font-size:14px}
 .tab span{font-size:16px}
 .fab{bottom:30px;right:max(30px,calc((100vw - 960px)/2 + 16px))}
 .toast{bottom:40px}
 .app{padding-bottom:120px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats.four{grid-template-columns:1fr 1fr}
@media(min-width:560px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typebtn{padding:12px 8px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px;border:2px solid transparent;text-align:center}
.typebtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:var(--soft);width:100%;text-align:left;font-weight:700}
.switchrow small{font-size:12px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.searchbox{position:relative}
.searchbox .inp{padding-left:42px}
.searchbox .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none}
.monthhead{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;font-weight:700;color:var(--muted);font-size:13px}
.monthbtn{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:4px 14px;border-radius:14px;min-width:0}
.monthbtn b{font-size:18px}.monthbtn small{font-size:11px;color:var(--muted);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{padding:14px 6px;border-radius:14px;background:var(--soft);font-weight:700;border:2px solid transparent}
.mgrid button.on{background:var(--accent);color:#fff}.mgrid button.now{border-color:var(--accent)}
.chiprow.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chiprow.scroll::-webkit-scrollbar{display:none}.chiprow.scroll .chip{flex:none}
.yrbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.yrbar b{font-size:18px}
</style>
</head>
<body data-mode="gate">
<div id="gate"></div>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">💰</div><div><h1>Expense Tracker</h1><p>Private · works offline</p></div></div>
    <div class="hright"><button id="status" class="pill" type="button"></button><button id="me" class="me" type="button" aria-label="Account menu"></button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main id="view"></main>
</div>
<button id="fab" class="fab" type="button" aria-label="Add expense">+</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const FS='showDirectoryPicker' in window;
const COLORS=['#f97316','#10b981','#3b82f6','#8b5cf6','#ec4899','#ef4444','#eab308','#06b6d4','#14b8a6','#64748b'];
const AVATARS=['😀','😎','🦊','🐼','🐯','🐸','🦄','🌻','🚀','🎧','🐙','🍀'];
const GROUP_ICONS=['🏠','✈️','🍕','🎉','🛒','🚗','🏖️','💼'];
const METHODS=['UPI','Cash','Card','Bank','Other'];
const DEFAULT_CATS=[['Food & Dining','🍽️','#f97316',8000],['Groceries','🛒','#10b981',6000],['Transport','🚗','#3b82f6',3000],['Rent & Bills','🧾','#8b5cf6',15000],['Shopping','🛍️','#ec4899',4000],['Health','💊','#ef4444',2000],['Entertainment','🎬','#eab308',2500],['Travel','✈️','#06b6d4',5000],['Education','📚','#14b8a6',2000],['Other','🧩','#64748b',2000]];
const hex=/^#[0-9a-f]{6}$/i,idRe=/^[a-z0-9]{3,40}$/i,dateRe=/^\d{4}-\d{2}-\d{2}$/;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const monthOf=d=>d.slice(0,7);
const MKEY=/^\d{4}-(0[1-9]|1[0-2])$/;
const monthAdd=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthDiff=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+(mb-ma)};
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const r2=n=>Math.round(n*100)/100;
const P=n=>Math.round(n*100);
const emo1=(v,d)=>[...String(v||d)].slice(0,2).join('');
const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(const kid of kids.flat(9)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)))}
  return e;
}
const NS='http://www.w3.org/2000/svg';
function s(tag,attrs){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);return e}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const colorFor=id=>COLORS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const avatar=(emoji,color,cls)=>h('span',{class:'avatar'+(cls?' '+cls:''),style:{background:color+'2e'}},emoji);

/* ================= storage backends ================= */
const ACC='et-accounts.json',SHR='et-shared.json',userFile=id=>`et-user-${id}.json`;
class FolderBackend{
  constructor(dir){this.dir=dir;this.kind='folder';this.label=dir.name}
  async read(n){try{const t=await(await(await this.dir.getFileHandle(n)).getFile()).text();return t.trim()?JSON.parse(t):null}catch(e){if(e&&e.name==='NotFoundError')return null;throw e}}
  async write(n,o){const w=await(await this.dir.getFileHandle(n,{create:true})).createWritable();await w.write(JSON.stringify(o,null,2));await w.close()}
  async remove(n){try{await this.dir.removeEntry(n)}catch(e){}}
}
class BrowserBackend{
  constructor(){this.kind='browser';this.label='this browser'}
  async read(n){
    try{const t=window.localStorage.getItem('et:'+n);if(t)return JSON.parse(t)}catch(e){}
    try{const v=await kvGet('et:'+n);return v==null?null:v}catch(e){return null}
  }
  async write(n,o){
    const value=JSON.stringify(o);
    try{window.localStorage.setItem('et:'+n,value);return}catch(e){}
    try{await kvSet('et:'+n,value)}catch(e){throw new Error('Browser storage is unavailable. Open this file in Chrome and allow site storage.')}
  }

function groupNets(g){
  const net={};g.memberIds.forEach(id=>net[id]=0);
  const add=(id,v)=>{net[id]=(net[id]||0)+v};
  shared.expenses.filter(e=>e.groupId===g.id).forEach(e=>{add(e.paidBy,P(e.amount));for(const[k,v]of Object.entries(e.owes))add(k,-P(v))});
  shared.settlements.filter(x=>x.groupId===g.id).forEach(x=>{add(x.from,P(x.amount));add(x.to,-P(x.amount))});
  return net;
}
function simplify(net){
  const cr=[],db=[];
  for(const[id,v]of Object.entries(net)){if(v>0)cr.push([id,v]);else if(v<0)db.push([id,-v])}
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){
    const x=Math.min(db[i][1],cr[j][1]);out.push({from:db[i][0],to:cr[j][0],amount:x/100});
    db[i][1]-=x;cr[j][1]-=x;if(!db[i][1])i++;if(!cr[j][1])j++;
  }
  return out;
}
function computeOwes(total,mode,vals,ids){
  if(!(total>0))return{err:'Enter the amount first'};
  let w;
  if(mode==='exact'){
    const a=ids.map(id=>P(parseFloat(vals[id])||0)),t=a.reduce((x,y)=>x+y,0);
    if(t!==total)return{err:t<total?`${fmtP(total-t)} left to assign`:`${fmtP(t-total)} over the total`};
    const o={};ids.forEach((id,i)=>{if(a[i]>0)o[id]=a[i]});return{owes:o};
  }
  w=ids.map(id=>mode==='equal'?(vals[id]?1:0):Math.max(0,parseFloat(vals[id])||0));
  if(mode==='percent'){const t=w.reduce((a,b)=>a+b,0);if(Math.abs(t-100)>0.001)return{err:`Percentages add up to ${r2(t)}% (need 100%)`}}
  const W=w.reduce((a,b)=>a+b,0);if(!(W>0))return{err:'Pick at least one person'};
  const raw=w.map(x=>total*x/W),base=raw.map(Math.floor);
  let rem=total-base.reduce((a,b)=>a+b,0);
  const order=raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0;k<rem;k++)base[order[k][1]]++;
  const o={};ids.forEach((id,i)=>{if(base[i]>0)o[id]=base[i]});return{owes:o};
}

  const custom=id=>{const m=(data.settings.monthBudgets||{})[ui.month];return!!(m&&m[scope]&&Object.prototype.hasOwnProperty.call(m[scope],id))&&budgetFor(scope,id)!==budgetFor(scope,id,monthAdd(ui.month,-1))};
  return h('div',{},monthBar(),
    h('section',{class:'card hero'},h('small',{},(coupleMode?'Couple budget · ':'Budget · ')+monthLabel(ui.month)),h('div',{class:'big',style:{marginBottom:0}},fmt(total))),
    h('section',{class:'card'},h('h3',{},coupleMode?'Couple category budgets':'Categories & budgets'),
      data.categories.map(c=>{const b=budgetFor(scope,c.id);return h('button',{class:'row-item',type:'button',onclick:()=>openCategory(c,scope)},
        h('span',{class:'ico',style:{background:c.color+'26'}},c.emoji),
        h('span',{class:'mid'},h('b',{},c.name),h('small',{},(b>0?'Tap to edit':'No budget set')+(custom(c.id)?' · changed this month':''))),
        h('b',{class:'amt'},b>0?fmt(b):'—'))}),
      h('div',{class:'row'},h('button',{class:'btn ghost',type:'button',onclick:()=>openCategory(null,scope)},'＋ Add category')),
      h('p',{class:'note'},'Every month can have its own budgets. A change applies from the month you are viewing onward (or to that month only, if you choose). Earlier months keep their old values.')));
}

/* ================= settings, backup, folder ================= */
async function exportFull(){
  await flushNow();const users={};
  for(const u of accounts.users)users[u.id]=u.id===me.id?data:await backend.read(userFile(u.id));
  download(`expense-tracker-full-backup-${todayStr()}.json`,JSON.stringify({app:'expense-tracker',type:'full',version:2,accounts,shared,users},null,2),'application/json');
  data.settings.lastExport=Date.now();save('user');toast('Full backup downloaded');render();
}
function exportMine(){download(`my-expenses-${todayStr()}.json`,JSON.stringify(data,null,2),'application/json');data.settings.lastExport=Date.now();save('user');toast('Downloaded');render()}
function csvCell(v){let t=String(v??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return'"'+t.replace(/"/g,'""')+'"'}
function exportCSV(){
  const rows=[['Date','Category','Amount','Note','Payment']].concat(data.expenses.slice().sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.date,cat(e.categoryId).name,e.amount,e.note,e.method]));
  download(`expenses-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');toast('CSV downloaded');
}
function importAny(){
  const inp=h('input',{type:'file',accept:'.json,application/json',style:{display:'none'},onchange:async()=>{
    const f=inp.files[0];inp.remove();if(!f)return;
    if(f.size>80*1024*1024)return toast('File is too large');
    try{
      const o=JSON.parse(await f.text());
      if(o&&o.type==='full'&&o.accounts){
        const acc=cleanAccounts(o.accounts),sh=cleanShared(o.shared);if(!acc.users.length)throw new Error('Backup has no users');
        if(!await ask('Restore full backup?',`It has ${acc.users.length} user(s) and ${sh.groups.length} group(s). This replaces ALL data in this storage and signs you out.`,'Restore',true))return;
        await flushNow();
        for(const u of acc.users){let d;try{d=sanitize(o.users&&o.users[u.id])}catch(e){d=freshData()}await bWrite(userFile(u.id),d)}
        accounts=acc;shared=sh;await bWrite(ACC,accounts);await bWrite(SHR,shared);toast('Backup restored');gateUsers();
      }else{
        const d=sanitize(o);
        if(!await ask('Import into your account?',`It has ${d.expenses.length} expenses. This replaces your personal expenses and categories (split groups are not touched).`,'Import'))return;
        data=d;commit();toast('Imported');
      }
    }catch(e){toast(e.message||'Invalid file')}
  }});
  document.body.append(inp);inp.click();
}
async function changeFolder(){
  const dir=await pickDir();if(!dir)return;
  const nb=new FolderBackend(dir);
  try{
    await flushNow();
    const existing=await nb.read(ACC);
    if(existing&&cleanAccounts(existing).users.length){
      if(!await ask('Use the data in this folder?',`“${dir.name}” already contains Expense Tracker data. The app will switch to it (your current data stays where it is) and sign you out.`,'Switch folder'))return;
      await kvSet('dir',dir);await kvSet('mode','folder');backend=nb;await afterBackend();return;
    }
    const old=backend,files=[ACC,SHR,...accounts.users.map(u=>userFile(u.id))];
    for(const f of files){const v=await old.read(f);if(v)await nb.write(f,v)}
    await kvSet('dir',dir);await kvSet('mode','folder');backend=nb;toast('Copied your data to “'+dir.name+'”');render();
  }catch(e){toast('Could not use that folder: '+(e.message||e))}
}
function viewSettings(){
  const set=(k,v)=>{data.settings[k]=v;applyTheme(data.settings.theme);commit()};
  const theme=h('div',{class:'seg'},['auto','light','dark'].map(t=>h('button',{type:'button',class:data.settings.theme===t?'on':'',onclick:()=>set('theme',t)},{auto:'🌗 Auto',light:'☀️ Light',dark:'🌙 Dark'}[t])));
  const cur=h('input',{class:'inp',maxlength:'3',value:data.settings.currency,style:{width:'100px',textAlign:'center',fontSize:'20px'},'aria-label':'Currency symbol',onchange:e=>{const v=e.target.value.trim();if(v)set('currency',v.slice(0,3))}});
  const last=data.settings.lastExport?new Date(data.settings.lastExport).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'never';
  const isFolder=backend.kind==='folder';
  return h('div',{},
    installEvt?h('section',{class:'card'},h('h3',{},'📲 Install as an app'),
      h('p',{class:'note',style:{margin:'0 0 10px'}},'Add Expense Tracker to your desktop or home screen. It opens in its own window and works offline.'),
      h('button',{class:'btn primary',type:'button',onclick:async()=>{installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()}},'Install app')):null,
    h('section',{class:'card'},h('h3',{},'Tracker type'),
      h('p',{class:'note',style:{margin:'0 0 10px'}},'Choose Single or Couple mode. Couple mode keeps the same screens and features, with an additional Paid by field when recording expenses.'),
      h('div',{class:'tracker-switch'},
        h('button',{type:'button',class:data.settings.trackerMode==='single'?'on':'',onclick:()=>{data.settings.trackerMode='single';ui.tab='home';commit()}},'👤 Single tracker'),
        h('button',{type:'button',class:data.settings.trackerMode==='couple'?'on':'',onclick:()=>{data.settings.trackerMode='couple';ui.tab='home';commit();if(!coupleGroup())openCoupleSetup()}},'💑 Couple tracker')),
      data.settings.trackerMode==='couple'?h('p',{class:'note'},'Couple mode is active. The interface and budgets remain the same; expense entries include a Paid by field.'):null),
    h('section',{class:'card'},h('h3',{},'Appearance'),theme,lbl('Currency symbol',{display:'block',fontSize:'12px',fontWeight:700,color:'var(--muted)',margin:'16px 0 6px',textTransform:'uppercase'}),cur),
    h('section',{class:'card'},h('h3',{},'👤 Users on this device'),
      accounts.users.map(u=>h('button',{class:'row-item',type:'button',onclick:()=>u.id===me.id?openAccount(u,{}):toast('Switch to that user to edit their account')},
        avatar(u.emoji,u.color),h('span',{class:'mid'},h('b',{},u.name,u.id===me.id?h('span',{class:'tag'},'You'):null),h('small',{},u.pin?'🔒 PIN protected':'No PIN')),h('span',{class:'muted'},u.id===me.id?'Edit ›':''))),
      h('div',{class:'stack',style:{marginTop:'12px'}},
        h('button',{class:'btn ghost',type:'button',onclick:()=>openAccount(null,{})},'＋ Add user'),
        h('button',{class:'btn ghost',type:'button',onclick:lock},'🔄 Switch user / Lock'))),
    h('section',{class:'card'},h('h3',{},isFolder?'📁 Data folder':'💾 Browser storage'),
      h('p',{class:'note',style:{margin:'0 0 10px'}},isFolder?`Everything is saved as JSON files in “${backend.label}” (et-accounts.json, et-shared.json and one et-user-… file per user).`:'Data is stored inside this browser. Clearing site data would erase it, so export backups regularly'+(FS?', or move it to a folder.':'.')),
      FS?h('button',{class:'btn ghost',type:'button',onclick:changeFolder},isFolder?'📁 Change folder':'📁 Save to a folder instead'):null),
    h('section',{class:'card'},h('h3',{},'Backup & restore'),
      h('div',{class:'stack'},
        h('button',{class:'btn ghost',type:'button',onclick:exportFull},'⬇️ Export full backup (all users + groups)'),
        h('button',{class:'btn ghost',type:'button',onclick:exportMine},'⬇️ Export my expenses (JSON)'),
        h('button',{class:'btn ghost',type:'button',onclick:exportCSV},'📊 Export my expenses (CSV)'),
        h('button',{class:'btn ghost',type:'button',onclick:importAny},'⬆️ Import backup / JSON')),
      h('p',{class:'note'},`Last export: ${last}.`)),
    h('section',{class:'card'},h('h3',{},'🔒 Privacy'),
      h('p',{class:'note',style:{margin:0}},'No account on any server, no tracking. The page’s security policy blocks every network request. PINs lock the screen only; the JSON files in your folder are not encrypted.')),
    h('section',{class:'card'},h('h3',{},'Danger zone'),
      h('button',{class:'btn outline-danger',type:'button',onclick:async()=>{
        if(await ask('Delete all your expenses?',`This removes ${data.expenses.length} personal expenses. Budgets and split groups stay.`,'Delete everything',true)){data.expenses=[];commit();toast('All expenses deleted')}}},'Delete all my expenses')));
}
const TABS=[['home','Home','🏠',viewHome],['history','History','🧾',viewHistory],['ledger','Ledger','💳',viewMonthLedger],['split','Split','🤝',viewSplit],['budgets','Budgets','🎯',viewBudgets],['settings','Settings','⚙️',viewSettings]];
function render(){
  if(!me||!data)return;
  const couple=data.settings.trackerMode==='couple';
  const navTabs=TABS.map(([id,label,icon,view])=>[id,label,icon,(couple&&id==='home')?viewCouple:view]);
  $('#tabs').classList.remove('couple-nav');
  $('#tabs').replaceChildren(...navTabs.map(([id,l,ic])=>h('button',{class:'tab'+(ui.tab===id?' on':''),type:'button','aria-current':ui.tab===id?'page':null,onclick:()=>{ui.tab=id;if(id!=='split')ui.group=null;render();window.scrollTo(0,0)}},h('span',{},ic),l)));
  $('#view').replaceChildren(navTabs.find(t=>t[0]===ui.tab)?.[3]?.()||viewHome());
  $('#me').textContent=me.emoji;$('#me').style.background=me.color+'2e';
  $('#fab').style.display='grid';
  $('#fab').setAttribute('aria-label',ui.tab==='split'?'Add shared expense':ui.tab==='ledger'?'Add ledger entry':'Add expense');
  renderStatus();
}
function renderStatus(){
  const b=$('#status');if(!b)return;b.className='pill';b.onclick=null;
  if(!backend){b.textContent='';return}
  const pre=backend.kind==='folder'?'📁 ':'💾 ';
  if(sstate==='error'){b.classList.add('warn');b.textContent='⚠ Save failed – tap to retry';
    b.onclick=async()=>{try{if(backend.dir)await backend.dir.requestPermission({mode:'readwrite'})}catch(e){}sstate='saving';renderStatus();flushNow()}}
  else{b.classList.add('ok');b.textContent=sstate==='saving'?pre+'Saving…':pre+'Saved';b.onclick=()=>{ui.tab='settings';render()}}
}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t||'auto')}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(me&&ui.tab==='settings')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App installed');if(me&&ui.tab==='settings')render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
$('#fab').addEventListener('click',()=>{if(ui.tab==='split')openSplit(null,ui.group);else if(ui.tab==='ledger')openLedgerEntry(null);else openExpense(null)});
$('#me').addEventListener('click',openMeMenu);
boot();
})();
</script>
